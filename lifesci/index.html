<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>비밀 연구소: 미생물의 문</title>
<style>
  :root{
    color-scheme: dark;
    --void:#05060f;
    --panel-a: rgba(11,17,48,0.86);
    --panel-b: rgba(22,12,52,0.86);
    --line-blue: rgba(79,224,255,0.28);
    --line-green: rgba(93,255,192,0.22);
    --neon-blue:#4fe0ff;
    --neon-green:#5dffc0;
    --neon-blue-soft: rgba(79,224,255,0.35);
    --neon-green-soft: rgba(93,255,192,0.35);
    --warn:#ff5c7a;
    --warn-soft: rgba(255,92,122,0.35);
    --text-hi:#eef1ff;
    --text-lo:#8b93c4;
    --font-display: "Batang", "바탕", Constantia, Georgia, "Times New Roman", serif;
    --font-body: "Malgun Gothic", "맑은 고딕", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Malgun Gothic", monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--void);
    color: var(--text-hi);
    font-family: var(--font-body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .bg-photo{ position:fixed; inset:0; z-index:0; background-size:cover; background-position:center;
    opacity:0; transition: opacity 1.1s ease; }
  .bg-close{ background-image:url('images/door-close.png'); opacity:1; }
  .bg-close.hide{ opacity:0; }
  .bg-open{ background-image:url('images/door-open.png'); }
  .bg-open.show{ opacity:1; }

  #particles{ position:fixed; inset:0; z-index:1; display:block;
    background: radial-gradient(ellipse 70% 50% at 50% -8%, rgba(23,14,61,0.55) 0%, rgba(5,6,15,0.72) 55%, rgba(3,3,9,0.85) 100%);
  }

  .stage{ position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: clamp(16px,4vw,48px); }

  .panel{ position:relative; width:100%; max-width: 940px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 20%),
      linear-gradient(160deg, var(--panel-a), var(--panel-b));
    border: 1px solid var(--line-blue);
    border-radius: 22px;
    box-shadow: 0 0 0 1px rgba(93,255,192,0.06), 0 0 54px rgba(79,224,255,0.16), 0 30px 90px rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: clamp(26px,4.6vw,52px);
    transition: transform .05s linear;
  }
  .panel::before, .panel::after{ content:""; position:absolute; width:30px; height:30px; pointer-events:none;
    filter: drop-shadow(0 0 5px currentColor); }
  .panel::before{ top:12px; left:12px; border-top:1.5px solid var(--neon-green); border-left:1.5px solid var(--neon-green);
    border-radius:6px 0 0 0; opacity:.75; color: var(--neon-green); }
  .panel::after{ bottom:12px; right:12px; border-bottom:1.5px solid var(--neon-blue); border-right:1.5px solid var(--neon-blue);
    border-radius:0 0 6px 0; opacity:.75; color: var(--neon-blue); }

  .eyebrow{ font-family: var(--font-display); font-style:italic; letter-spacing:.16em; font-size:.86rem;
    color: var(--neon-green); opacity:.9; margin: 0 0 14px; }

  .divider{ height:1px; margin: 4px 0 22px; opacity:.7;
    background: linear-gradient(90deg, transparent, var(--line-blue) 20%, var(--line-green) 80%, transparent); }

  h1,h2{ font-family: var(--font-display); text-wrap: balance; margin:0; }

  /* ---------- Prologue ---------- */
  .prologue{ text-align:center; padding: clamp(20px,6vw,10px) 0; }
  .prologue-text{ font-family: var(--font-display); font-size: clamp(1.15rem, 2.6vw, 1.7rem); line-height:1.7;
    color: var(--text-hi); min-height: 4.6em; letter-spacing:.01em; text-shadow: 0 0 18px rgba(79,224,255,0.25); }
  .cursor{ display:inline-block; width:.5ch; background: var(--neon-blue); margin-left:2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .continue-btn{ margin-top: 34px; opacity:0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease; }
  .continue-btn.show{ opacity:1; transform:none; }

  /* ---------- Buttons ---------- */
  .btn-neon{ font-family: var(--font-display); text-transform:uppercase; letter-spacing:.14em; font-weight:600;
    font-size:.94rem; color: var(--neon-blue);
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 55%), rgba(79,224,255,0.09);
    border:1px solid var(--neon-blue);
    padding: 14px 32px; border-radius: 12px; cursor:pointer;
    box-shadow: 0 0 10px rgba(79,224,255,0.18) inset, 0 0 14px rgba(79,224,255,0.18);
    transition: box-shadow .3s ease, transform .18s ease, background .3s ease; }
  .btn-neon:hover{ background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%), rgba(79,224,255,0.19);
    box-shadow: 0 0 22px rgba(79,224,255,0.7), 0 0 50px rgba(79,224,255,0.32); transform: translateY(-1px); }
  .btn-neon:active{ transform: translateY(0); }
  .btn-neon:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }
  .btn-neon:focus-visible{ outline: 2px solid var(--neon-green); outline-offset: 3px; }

  /* ---------- Dr.Bio + dialogue ---------- */
  .bio-row{ display:flex; gap: clamp(18px,3.4vw,32px); align-items: stretch; margin: 6px 0 24px; }
  .bio-avatar{ position:relative; flex: 0 0 auto; width: clamp(160px,32vw,300px); aspect-ratio: 3 / 4;
    border-radius: 20px; overflow:hidden; border:1px solid var(--line-blue);
    background: radial-gradient(ellipse at 50% 28%, rgba(79,224,255,0.10), rgba(5,6,15,0.92));
    box-shadow: 0 0 0 1px rgba(93,255,192,0.08), 0 0 36px rgba(79,224,255,0.22), inset 0 0 46px rgba(0,0,0,0.55); }
  .bio-avatar::before, .bio-avatar::after{ content:""; position:absolute; width:16px; height:16px; z-index:1; pointer-events:none; }
  .bio-avatar::before{ top:8px; left:8px; border-top:1.5px solid var(--neon-green); border-left:1.5px solid var(--neon-green); opacity:.8; }
  .bio-avatar::after{ bottom:8px; right:8px; border-bottom:1.5px solid var(--neon-blue); border-right:1.5px solid var(--neon-blue); opacity:.8; }
  .bio-avatar img{ width:100%; height:100%; display:block; object-fit:cover; object-position:50% 14%;
    filter: saturate(1.05) contrast(1.04); transition: opacity .2s ease; }
  @keyframes charReact{ 0%{ transform:scale(1); filter:saturate(1.05) contrast(1.04) brightness(1);}
    35%{ transform:scale(1.035); filter:saturate(1.15) contrast(1.06) brightness(1.22);}
    100%{ transform:scale(1); filter:saturate(1.05) contrast(1.04) brightness(1);} }
  .bio-avatar img.char-react{ animation: charReact .55s ease; }

  .dialogue-box{ position:relative; flex:1; min-width:0; background: rgba(5,8,24,0.55);
    border:1px solid var(--line-green); border-radius: 16px; padding: 18px 22px; display:flex; align-items:center; }
  .dialogue-box::before{ content:"DR. BIO"; position:absolute; top:-11px; left:16px; font-family: var(--font-display);
    font-style:italic; font-size:.72rem; letter-spacing:.18em; background: #0b1130; padding: 2px 10px; border:1px solid var(--line-green);
    border-radius: 6px; color: var(--neon-green); }
  .dialogue-box p{ margin:0; line-height:1.7; font-size: clamp(.97rem,1.6vw,1.1rem); color: var(--text-hi); min-height: 1.7em; }

  /* ---------- Name screen ---------- */
  .name-form{ display:flex; flex-wrap:wrap; gap:12px; margin-top: 6px; }
  .name-input{ flex:1; min-width:180px; background: rgba(5,8,24,0.65); border:1px solid var(--line-blue);
    border-radius:12px; padding: 13px 18px; color: var(--text-hi); font-family: var(--font-body); font-size:1rem; }
  .name-input::placeholder{ color: var(--text-lo); }
  .name-input:focus-visible{ outline:2px solid var(--neon-blue); outline-offset:2px; }
  .name-input.shake{ animation: shake .4s ease; border-color: var(--warn); }
  @keyframes shake{ 20%,60%{ transform: translateX(-6px);} 40%,80%{ transform: translateX(6px);} }

  /* ---------- HUD / gauge ---------- */
  .hud-row{ display:flex; justify-content:space-between; align-items:baseline; font-family: var(--font-mono);
    font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color: var(--text-lo); margin-bottom:8px; }
  .hud-row .mono{ color: var(--neon-green); font-variant-numeric: tabular-nums; }
  .gauge{ display:flex; gap:6px; margin-bottom: 20px; }
  .gauge-seg{ flex:1; height:9px; border-radius:3px; background: rgba(255,255,255,0.05); border:1px solid rgba(79,224,255,0.22); }
  .gauge-seg.filled{ background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
    box-shadow: 0 0 10px rgba(93,255,192,0.55); animation: gaugeOn .6s ease; }
  .gauge-seg.current{ border-color: var(--neon-green); animation: gaugePulse 1.5s ease-in-out infinite; }
  @keyframes gaugeOn{ 0%{ opacity:.1; } 30%{ opacity:1; } 45%{ opacity:.3; } 60%{ opacity:1; } 100%{ opacity:1; } }
  @keyframes gaugePulse{ 0%,100%{ box-shadow: 0 0 4px rgba(93,255,192,0.3);} 50%{ box-shadow: 0 0 14px rgba(93,255,192,0.85);} }

  /* ---------- Fact image reveal ---------- */
  .fact-image-wrap{ margin: 0 0 22px; opacity:0; max-height:0; overflow:hidden;
    transform: translateY(10px) scale(.98);
    transition: opacity .6s ease, transform .6s ease, max-height .6s ease; }
  .fact-image-wrap.show{ opacity:1; max-height: 900px; transform:none; }
  .fact-image-label{ font-family: var(--font-display); font-style:italic; font-size:.78rem; letter-spacing:.14em;
    color: var(--neon-green); text-align:center; margin-bottom:8px; opacity:.85; }
  .fact-image-frame{ position:relative; border-radius:18px; border:1px solid var(--line-green);
    background: rgba(5,8,24,0.4); padding: 8px;
    box-shadow: 0 0 0 1px rgba(79,224,255,0.06), 0 0 34px rgba(93,255,192,0.2), 0 18px 40px rgba(0,0,0,0.4); }
  .fact-image-frame::before, .fact-image-frame::after{ content:""; position:absolute; width:18px; height:18px; pointer-events:none; }
  .fact-image-frame::before{ top:8px; left:8px; border-top:1.5px solid var(--neon-blue); border-left:1.5px solid var(--neon-blue); opacity:.8; }
  .fact-image-frame::after{ bottom:8px; right:8px; border-bottom:1.5px solid var(--neon-green); border-right:1.5px solid var(--neon-green); opacity:.8; }
  .fact-image{ display:block; width:100%; height:auto; max-height:52vh; object-fit:contain; border-radius:12px; margin:0 auto; }

  /* ---------- Quest card ---------- */
  .quest-card{ perspective: 1400px; min-height: 300px; }
  .quest-card-inner{ position:relative; width:100%; min-height:300px; transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  .quest-card.flipped .quest-card-inner{ transform: rotateY(180deg); }
  .card-face{ position:absolute; inset:0; backface-visibility: hidden; border-radius:16px;
    border:1px solid var(--line-blue);
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 22%), rgba(5,8,24,0.5);
    padding: clamp(18px,3.4vw,30px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
  .card-back{ transform: rotateY(180deg); border-color: var(--line-green); }

  .quest-tag{ font-family: var(--font-display); font-style:italic; font-size:.86rem; letter-spacing:.1em; color: var(--neon-blue); opacity:.85; }
  .quest-text{ font-size: clamp(1.08rem,2.4vw,1.38rem); line-height:1.6; margin:0; text-wrap: balance; }

  .ox-row{ display:flex; gap: clamp(20px,5vw,44px); }
  .ox-btn{ width: clamp(80px,14vw,116px); height: clamp(80px,14vw,116px); border-radius:50%;
    font-family: var(--font-display); font-size: clamp(1.8rem,4vw,2.4rem); font-weight:700; cursor:pointer;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.06), rgba(11,17,48,0.55));
    transition: box-shadow .2s ease, transform .15s ease, opacity .2s ease; }
  .ox-btn.o{ border:2px solid var(--neon-green); color: var(--neon-green);
    box-shadow: 0 0 10px rgba(93,255,192,0.22) inset, 0 0 16px rgba(93,255,192,0.22); }
  .ox-btn.o:hover, .ox-btn.o:focus-visible{ box-shadow: 0 0 26px rgba(93,255,192,0.85), 0 0 60px rgba(93,255,192,0.4); transform: scale(1.06); }
  .ox-btn.x{ border:2px solid var(--warn); color: var(--warn);
    box-shadow: 0 0 10px rgba(255,92,122,0.22) inset, 0 0 16px rgba(255,92,122,0.22); }
  .ox-btn.x:hover, .ox-btn.x:focus-visible{ box-shadow: 0 0 26px rgba(255,92,122,0.85), 0 0 60px rgba(255,92,122,0.4); transform: scale(1.06); }
  .ox-btn:focus-visible{ outline: 2px solid #fff; outline-offset:3px; }
  .ox-btn:disabled{ opacity:.3; pointer-events:none; }

  .verdict{ font-family: var(--font-display); font-weight:700; font-size:1.28rem; letter-spacing:.02em; }
  .verdict.correct{ color: var(--neon-green); text-shadow: 0 0 14px rgba(93,255,192,0.6); }
  .verdict.wrong{ color: var(--warn); text-shadow: 0 0 14px rgba(255,92,122,0.6); }
  .fact-text{ margin:0; line-height:1.6; font-size:.98rem; color: var(--text-hi); }

  /* ---------- Scan / warp transition ---------- */
  .scan-overlay{ position:fixed; inset:0; z-index:80; pointer-events:none; overflow:hidden; }
  .scan-line{ position:absolute; left:0; right:0; top:-6%; height:3px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-green), transparent);
    box-shadow: 0 0 24px 8px rgba(79,224,255,0.75);
    animation: scanSweep 1.05s linear forwards; }
  @keyframes scanSweep{ from{ top:-6%; } to{ top:106%; } }
  .scan-caption{ position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    font-family: var(--font-mono); letter-spacing:.3em; font-size:.8rem; color: var(--neon-green);
    text-shadow: 0 0 12px rgba(93,255,192,0.7); animation: capFade 1.05s ease forwards; }
  @keyframes capFade{ 0%{ opacity:0; } 20%{ opacity:1; } 80%{ opacity:1; } 100%{ opacity:0; } }

  .warp{ animation: warpShake .7s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes warpShake{
    0%{ transform: none; filter:none; }
    15%{ transform: translate(-3px,2px) skewX(1deg); }
    30%{ transform: translate(3px,-2px) skewX(-1deg); filter: hue-rotate(8deg); }
    45%{ transform: translate(-4px,1px) scale(1.01); }
    60%{ transform: translate(3px,-1px) skewX(1deg); filter: hue-rotate(-8deg); }
    75%{ transform: translate(-2px,2px); }
    100%{ transform:none; filter:none; }
  }
  .bloom{ position:fixed; inset:0; z-index:70; pointer-events:none;
    background: radial-gradient(circle at 50% 50%, rgba(200,240,255,0.9), rgba(79,224,255,0.25) 35%, transparent 70%);
    opacity:0; animation: bloomFlash .9s ease forwards; }
  @keyframes bloomFlash{ 0%{ opacity:0; transform:scale(.3);} 35%{ opacity:.85; transform:scale(1);} 100%{ opacity:0; transform:scale(1.4);} }

  /* ---------- Result screen ---------- */
  .terminal{ font-family: var(--font-mono); font-size:.86rem; color: var(--neon-green); line-height:1.9;
    min-height: 7.6em; white-space: pre-wrap; }
  .terminal .done{ color: var(--text-lo); }
  .terminal .done::before{ content:"✓ "; color: var(--neon-green); }

  .result-reveal{ margin-top: 8px; }
  .score-display{ display:flex; align-items:baseline; justify-content:center; gap:8px; margin: 10px 0 18px; font-family: var(--font-display); }
  .score-num{ font-size: clamp(2.6rem,8vw,3.6rem); color: var(--neon-blue); text-shadow: 0 0 26px rgba(79,224,255,0.6);
    font-variant-numeric: tabular-nums; }
  .score-suffix{ color: var(--text-lo); font-size:1.1rem; }

  .quest-grid{ display:grid; grid-template-columns: repeat(10,1fr); gap:8px; margin: 18px 0 26px; }
  .quest-grid .qi{ aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:700; font-size:.95rem; opacity:0; animation: qiIn .4s ease forwards; }
  .quest-grid .qi.ok{ border:1px solid var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(93,255,192,0.35) inset; }
  .quest-grid .qi.bad{ border:1px solid var(--warn); color: var(--warn); box-shadow: 0 0 10px rgba(255,92,122,0.35) inset; }
  @keyframes qiIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }

  .center-row{ display:flex; justify-content:center; margin-top: 10px; }
  .btn-row{ display:flex; justify-content:center; gap: 14px; flex-wrap:wrap; margin-top: 10px; }

  /* ---------- Certificate screen ---------- */
  .cert-status{ font-family: var(--font-mono); letter-spacing:.1em; font-size:.86rem; color: var(--text-lo);
    text-align:center; padding: 54px 0; }
  .cert-frame{ margin-bottom: 22px; }

  @media (max-width: 560px){
    .bio-row{ flex-direction:column; align-items:center; text-align:center; }
    .dialogue-box{ width:100%; }
    .ox-row{ gap: 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div id="bgClose" class="bg-photo bg-close"></div>
<div id="bgOpen" class="bg-photo bg-open"></div>
<div id="particles"></div>
<div class="stage">
  <div class="panel" id="panel">
    <div id="app"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- Quiz data ---------------- */
  var quizData = [
    { text: "빵이 부풀어 오르는 것은 효모(곰팡이)가 만든 이산화탄소 때문이다.", answer: true, fact: "효모는 균류의 한 종류로, 발효 과정에서 이산화탄소를 만들어 반죽을 부풀게 해요." },
    { text: "무좀은 세균이 아니라 곰팡이 때문에 생긴다.", answer: true, fact: "무좀은 곰팡이균(백선균)이 피부에 감염되어 생기는 질환이에요." },
    { text: "김치가 발효되는 것은 세균과 아무 관련이 없다.", answer: false, fact: "김치는 유산균(세균)이 발효를 일으켜 맛과 신맛을 만들어내요." },
    { text: "페니실린은 푸른곰팡이에서 발견되었다.", answer: true, fact: "플레밍이 우연히 푸른곰팡이 주변에 세균이 자라지 못하는 것을 보고 페니실린을 발견했어요." },
    { text: "말라리아는 세균 때문에 생기는 병이다.", answer: false, fact: "말라리아는 원생생물인 플라스모디움이 모기를 통해 옮기는 질병이에요." },
    { text: "요구르트는 유산균(세균)이 우유를 발효시켜 만든다.", answer: true, fact: "유산균이 우유 속 성분을 분해하며 새콤한 맛의 요구르트를 만들어요." },
    { text: "곰팡이와 세균은 낙엽이나 동물의 사체를 분해하는 역할을 한다.", answer: true, fact: "이들을 분해자라고 부르며, 자연의 물질 순환에 꼭 필요한 역할을 해요." },
    { text: "치즈를 만드는 데 곰팡이가 이용되기도 한다.", answer: true, fact: "블루치즈, 카망베르 치즈 등은 특정 곰팡이를 이용해 숙성시켜요." },
    { text: "충치는 입안의 곰팡이 때문에 생긴다.", answer: false, fact: "충치는 입안 세균이 당분을 분해하며 만든 산이 치아를 부식시켜 생겨요." },
    { text: "이질(설사병)을 일으키는 아메바는 원생생물에 속한다.", answer: true, fact: "이질아메바는 원생생물로, 오염된 물이나 음식을 통해 감염될 수 있어요." }
  ];

  var state = { screen: "prologue", name: "", qIndex: 0, score: 0, results: [] };

  var app = document.getElementById("app");
  var panel = document.getElementById("panel");

  /* ---------------- helpers ---------------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function typeInto(el, text, speed){
    speed = reduceMotion ? 0 : (speed || 26);
    el.textContent = "";
    if (speed === 0){ el.textContent = text; return Promise.resolve(); }
    return new Promise(function(resolve){
      var i = 0;
      var id = setInterval(function(){
        el.textContent += text.charAt(i);
        i++;
        if (i >= text.length){ clearInterval(id); el._typeId = null; resolve(); }
      }, speed);
      el._typeId = id;
      el._full = text;
      el.onclick = function(){
        if (el._typeId){ clearInterval(el._typeId); el._typeId = null; el.textContent = el._full; }
      };
    });
  }

  /* ---------------- audio ---------------- */
  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, delay, gain){
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.14, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + (dur || 0.12) + 0.03);
  }
  function sfxSelect(){ ensureAudio(); beep(660,.08,"sine",0,.1); beep(880,.1,"sine",.06,.1); }
  function sfxCorrect(){ ensureAudio(); beep(523,.1,"triangle",0,.14); beep(659,.1,"triangle",.09,.14); beep(784,.18,"triangle",.18,.14); }
  function sfxWrong(){ ensureAudio(); beep(220,.22,"sawtooth",0,.11); beep(160,.28,"sawtooth",.05,.09); }
  function sfxScan(){
    ensureAudio();
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(110, t0);
    osc.frequency.exponentialRampToValueAtTime(1100, t0 + 0.8);
    g.gain.setValueAtTime(0.001, t0);
    g.gain.linearRampToValueAtTime(0.11, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.9);
  }

  /* ---------------- particle background ---------------- */
  (function particles(){
    var canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;z-index:0;display:block;";
    document.getElementById("particles").appendChild(canvas);
    var ctx = canvas.getContext("2d");
    var w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var dots = [];
    var N = 70;
    var colors = ["79,224,255", "93,255,192", "170,140,255"];

    function resize(){
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function init(){
      dots = [];
      for (var i=0;i<N;i++){
        dots.push({
          x: Math.random()*w, y: Math.random()*h,
          r: 0.6 + Math.random()*1.8,
          vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.12,
          c: colors[i % colors.length],
          a: 0.25 + Math.random()*0.5
        });
      }
    }
    resize(); init();
    window.addEventListener("resize", function(){ resize(); init(); });

    var t = 0;
    function drawAurora(){
      var bands = [
        { y: h*0.28, amp: 26, speed: 0.0006, color: "79,224,255" },
        { y: h*0.62, amp: 34, speed: 0.0004, color: "93,255,192" },
        { y: h*0.85, amp: 20, speed: 0.0005, color: "170,140,255" }
      ];
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      bands.forEach(function(b, bi){
        ctx.beginPath();
        for (var x=0; x<=w; x+=24){
          var y = b.y + Math.sin(x*0.006 + t*b.speed + bi) * b.amp;
          if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
        var grad = ctx.createLinearGradient(0, b.y-b.amp, 0, h);
        grad.addColorStop(0, "rgba(" + b.color + ",0.10)");
        grad.addColorStop(1, "rgba(" + b.color + ",0)");
        ctx.fillStyle = grad;
        ctx.fill();
      });
      ctx.restore();
    }

    function frame(){
      ctx.clearRect(0,0,w,h);
      drawAurora();
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      dots.forEach(function(d){
        d.x += d.vx; d.y += d.vy;
        if (d.x < -10) d.x = w+10; if (d.x > w+10) d.x = -10;
        if (d.y < -10) d.y = h+10; if (d.y > h+10) d.y = -10;
        ctx.beginPath();
        ctx.fillStyle = "rgba(" + d.c + "," + d.a + ")";
        ctx.shadowColor = "rgba(" + d.c + ",0.9)";
        ctx.shadowBlur = 8;
        ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.restore();
      t += 16;
      if (!reduceMotion) requestAnimationFrame(frame);
    }
    frame();
  })();

  function warpTransition(){
    return new Promise(function(resolve){
      sfxScan();
      setDoorOpen(true);
      var overlay = document.createElement("div");
      overlay.className = "scan-overlay";
      overlay.innerHTML = '<div class="scan-line"></div><div class="scan-caption">SCANNING IDENTITY...</div>';
      document.body.appendChild(overlay);
      panel.classList.add("warp");
      var dur = reduceMotion ? 100 : 900;
      setTimeout(function(){
        overlay.remove();
        panel.classList.remove("warp");
        var bloom = document.createElement("div");
        bloom.className = "bloom";
        document.body.appendChild(bloom);
        setTimeout(function(){ bloom.remove(); }, reduceMotion ? 50 : 900);
        resolve();
      }, dur);
    });
  }

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function strokeGlowRect(ctx, x, y, w, h, r, color, lineWidth, glow){
    roundRectPath(ctx, x, y, w, h, r);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.shadowColor = color;
    ctx.shadowBlur = glow || 0;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawCornerTicks(ctx, x, y, w, h, len, colorA, colorB){
    ctx.save();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = colorA; ctx.shadowColor = colorA; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
    ctx.strokeStyle = colorB; ctx.shadowColor = colorB;
    ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
    ctx.strokeStyle = colorA; ctx.shadowColor = colorA;
    ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
    ctx.restore();
  }

  function drawDividerLine(ctx, cx, y, width, colorA, colorB){
    var g = ctx.createLinearGradient(cx - width / 2, 0, cx + width / 2, 0);
    g.addColorStop(0, "rgba(79,224,255,0)");
    g.addColorStop(0.2, colorA);
    g.addColorStop(0.8, colorB);
    g.addColorStop(1, "rgba(93,255,192,0)");
    ctx.strokeStyle = g; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - width / 2, y); ctx.lineTo(cx + width / 2, y); ctx.stroke();
  }

  function drawImageCover(ctx, img, dx, dy, dw, dh, posX, posY, radius){
    ctx.save();
    roundRectPath(ctx, dx, dy, dw, dh, radius || 0);
    ctx.clip();
    var nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
    var scale = Math.max(dw / nw, dh / nh);
    var drawW = nw * scale, drawH = nh * scale;
    var offsetX = dx + (dw - drawW) * posX;
    var offsetY = dy + (dh - drawH) * posY;
    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
    ctx.restore();
  }

  function drawScoreBadge(ctx, cx, cy, r, score, color){
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    var fill = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
    fill.addColorStop(0, "rgba(255,255,255,0.06)"); fill.addColorStop(1, "rgba(5,8,24,0.55)");
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 20; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(200,210,255,0.75)";
    ctx.font = "20px ui-monospace, Consolas, monospace";
    ctx.fillText("SCORE", cx, cy - 24);
    ctx.fillStyle = "#eef1ff";
    ctx.font = 'bold 54px "Batang", Georgia, serif';
    ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.fillText(String(score), cx, cy + 26);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(200,210,255,0.6)";
    ctx.font = "18px ui-monospace, Consolas, monospace";
    ctx.fillText("/ 100", cx, cy + 54);
    ctx.restore();
  }

  function drawResultDots(ctx, cx, y, results){
    var n = results.length, size = 20, gap = 12;
    var total = n * size + (n - 1) * gap;
    var startX = cx - total / 2 + size / 2;
    for (var i = 0; i < n; i++){
      var x = startX + i * (size + gap);
      var ok = results[i];
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, size / 2, 0, Math.PI * 2);
      ctx.fillStyle = ok ? "rgba(93,255,192,0.12)" : "rgba(255,92,122,0.12)";
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = ok ? "#5dffc0" : "#ff5c7a";
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawSeal(ctx, cx, cy, r){
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "#5dffc0"; ctx.lineWidth = 2; ctx.shadowColor = "#5dffc0"; ctx.shadowBlur = 14; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r - 9, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(79,224,255,0.6)"; ctx.lineWidth = 1; ctx.shadowBlur = 0; ctx.stroke();
    ctx.fillStyle = "#4fe0ff";
    ctx.textAlign = "center";
    ctx.font = "bold 15px ui-monospace, Consolas, monospace";
    ctx.fillText("VERIFIED", cx, cy - 2);
    ctx.font = "11px ui-monospace, Consolas, monospace";
    ctx.fillStyle = "rgba(200,210,255,0.75)";
    ctx.fillText("BIO LAB", cx, cy + 14);
    ctx.restore();
  }

  function buildCertificateCanvas(){
    var finalScore = state.score * 10;
    var tierTitle, tierColor, portraitFile;
    if (finalScore === 100){ tierTitle = "레전드 생명과학 마스터"; tierColor = "#e8c987"; portraitFile = "c4.png"; }
    else if (finalScore >= 70){ tierTitle = "수석 연구원 인증"; tierColor = "#5dffc0"; portraitFile = "c1.png"; }
    else { tierTitle = "탐사 인증 · 계속 도전!"; tierColor = "#4fe0ff"; portraitFile = "c1.png"; }

    var today = new Date();
    var dateStr = today.getFullYear() + "." + String(today.getMonth() + 1).padStart(2, "0") + "." + String(today.getDate()).padStart(2, "0");

    return loadImage("images/" + portraitFile).then(function(portraitImg){
      var W = 1600, H = 1000;
      var canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext("2d");

      var bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, "#0b1130"); bg.addColorStop(1, "#170c34");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      var glow = ctx.createRadialGradient(W * 0.5, H * 0.22, 10, W * 0.5, H * 0.22, W * 0.55);
      glow.addColorStop(0, "rgba(79,224,255,0.16)"); glow.addColorStop(1, "rgba(79,224,255,0)");
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      strokeGlowRect(ctx, 40, 40, W - 80, H - 80, 20, "rgba(79,224,255,0.85)", 3, 16);
      strokeGlowRect(ctx, 60, 60, W - 120, H - 120, 14, "rgba(93,255,192,0.45)", 1.2, 0);
      drawCornerTicks(ctx, 40, 40, W - 80, H - 80, 42, "#5dffc0", "#4fe0ff");

      ctx.textAlign = "center";
      ctx.fillStyle = "#5dffc0";
      ctx.font = 'italic 22px "Batang", Georgia, serif';
      ctx.shadowColor = "rgba(93,255,192,0.5)"; ctx.shadowBlur = 8;
      ctx.fillText("SECRET BIOLOGY LAB · CERTIFICATE OF COMPLETION", W / 2, 128);
      ctx.shadowBlur = 0;

      drawDividerLine(ctx, W / 2, 152, 520, "#4fe0ff", "#5dffc0");

      ctx.fillStyle = "#f4f6ff";
      ctx.font = 'bold 66px "Batang", Georgia, serif';
      ctx.shadowColor = "rgba(79,224,255,0.45)"; ctx.shadowBlur = 20;
      ctx.fillText("미생물 마스터 인증서", W / 2, 240);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#c7cdf0";
      ctx.font = '22px "Malgun Gothic", sans-serif';
      ctx.fillText("이 증서는 아래 탐험가가 비밀 생명과학 연구소의 10가지 미생물 퀘스트를 모두 수행하고", W / 2, 284);
      ctx.fillText("그 자격을 인정받았음을 증명합니다.", W / 2, 314);

      var name = (state.name || "이름 없는").trim();
      ctx.fillStyle = "#ffffff";
      ctx.font = 'italic bold 52px "Batang", Georgia, serif';
      ctx.shadowColor = "rgba(79,224,255,0.55)"; ctx.shadowBlur = 14;
      ctx.fillText(name + " 탐험가", W / 2, 400);
      ctx.shadowBlur = 0;

      drawDividerLine(ctx, W / 2, 424, 320, "#4fe0ff", "#5dffc0");

      ctx.fillStyle = tierColor;
      ctx.font = 'italic bold 38px "Batang", Georgia, serif';
      ctx.shadowColor = tierColor; ctx.shadowBlur = 16;
      ctx.fillText(tierTitle, W / 2, 486);
      ctx.shadowBlur = 0;

      drawResultDots(ctx, W / 2, 560, state.results);

      if (portraitImg){
        drawImageCover(ctx, portraitImg, 130, 540, 260, 340, 0.5, 0.14, 16);
        strokeGlowRect(ctx, 130, 540, 260, 340, 16, "rgba(79,224,255,0.7)", 2, 10);
      }

      drawScoreBadge(ctx, W - 270, 710, 100, finalScore, tierColor);

      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(200,210,255,0.75)";
      ctx.font = "19px ui-monospace, Consolas, monospace";
      ctx.fillText("발급일 · " + dateStr, 110, 922);

      ctx.textAlign = "right";
      ctx.fillText("발급 · 닥터 바이오 (비밀 생명과학 연구소장)", 1350, 922);

      drawSeal(ctx, 1450, 878, 44);

      return canvas;
    });
  }

  function renderCertificate(){
    app.innerHTML =
      '<div class="eyebrow">인증서 발급</div>' +
      '<div class="divider"></div>' +
      '<div class="cert-status" id="certStatus">연구소 인증서를 생성하는 중...</div>' +
      '<div class="cert-frame fact-image-frame" id="certFrame" hidden><img class="fact-image" id="certImage" alt="미생물 마스터 인증서" /></div>' +
      '<div class="btn-row">' +
        '<button class="btn-neon" id="certDownloadBtn" disabled>PNG 이미지로 저장</button>' +
        '<button class="btn-neon" id="certBackBtn">처음부터 다시 도전</button>' +
      '</div>';

    document.getElementById("certBackBtn").addEventListener("click", restartGame);

    var statusEl = document.getElementById("certStatus");
    var frameEl = document.getElementById("certFrame");
    var imgEl = document.getElementById("certImage");
    var downloadBtn = document.getElementById("certDownloadBtn");

    buildCertificateCanvas().then(function(canvas){
      var dataUrl;
      try{
        dataUrl = canvas.toDataURL("image/png");
      } catch (err){
        statusEl.textContent = "인증서 이미지를 생성하지 못했어요. 배포된 주소(https://lifesci.pages.dev)에서 다시 시도해 주세요.";
        return;
      }
      imgEl.src = dataUrl;
      statusEl.hidden = true;
      frameEl.hidden = false;
      downloadBtn.disabled = false;
      downloadBtn.addEventListener("click", function(){
        sfxSelect();
        var safeName = (state.name || "탐험가").replace(/[\\/:*?"<>|]/g, "").trim() || "탐험가";
        var a = document.createElement("a");
        a.href = dataUrl;
        a.download = "미생물마스터인증서_" + safeName + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    });
  }

  renderPrologue();
})();
</script>
</body>
</html>
